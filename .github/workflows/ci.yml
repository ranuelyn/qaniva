name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm -r --filter "./packages/*" run build

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test

      - name: Validate case fixtures
        run: pnpm run validate:cases

  clinical-engine:
    name: Clinical engine (C#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore
        working-directory: clinical-core

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release
        working-directory: clinical-core

      - name: Format check
        run: dotnet format --verify-no-changes
        working-directory: clinical-core

      - name: Test (unit + determinism + golden replay)
        run: dotnet test --no-build -c Release
        working-directory: clinical-core

  # ---------------------------------------------------------------------------
  # Unity CI is NOT run here (deliberately — no flaky stub jobs). What a real job
  # needs, learned from the 2026-08-31 integration sprint where everything below
  # was executed locally and passed (13/13 EditMode incl. real-engine golden):
  #   - Unity 6000.5.10f1 editor (~5.1GB) + iOS Build Support (~2.4GB)
  #   - a licensed Unity account: licensing auto-provisions from a signed-in Hub
  #     session; a runner needs UNITY_EMAIL/UNITY_PASSWORD/UNITY_LICENSE secrets
  #     (GameCI pattern) or a pre-activated self-hosted macOS runner
  #   - headless commands (documented in unity/QanivaSimulation/README.md):
  #       Unity -batchmode -runTests -testPlatform EditMode ...
  #       scripts/export-unity-ios.sh  (macOS + Xcode required)
  # Tracked as QAN-024. Until then the RN<->Unity contract is protected in the
  # TypeScript job above (csharp-parity + csharp-structural-parity), and Unity
  # EditMode tests run locally.
  #
  # The RN iOS host build (xcodebuild, no Unity needed) also requires a macOS
  # runner and is likewise deferred to QAN-024/QAN-025.
  # ---------------------------------------------------------------------------
